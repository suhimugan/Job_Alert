name: 🌙 Evening Job Alerts

on:
  workflow_dispatch:
  schedule:
    # 9:00 PM IST = 3:30 PM UTC
    - cron: '30 15 * * *'

permissions:
  contents: read

jobs:
  scrape:
    name: Run Evening Job Scraper
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore seen jobs database
        uses: actions/cache/restore@v4
        with:
          path: data/seen_jobs.json
          key: seen-jobs-db-${{ github.run_id }}
          restore-keys: |
            seen-jobs-db-

      - name: Run evening scraper
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          USE_SERPAPI: 'false'
          USE_LLM: 'false'
          DRY_RUN: 'false'
        run: node src/main.js

      - name: Save seen jobs database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/seen_jobs.json
          key: seen-jobs-db-${{ github.run_id }}
